8c1bc92708.002.1", "@type": "wx:Alert", "affectedZones": ["https://api.weather.gov/zones/forecast/NCZ012", "https://api.weather.gov/zones/forecast/NCZ013", "https://api.weather.gov/zones/forecast/NCZ014", "https://api.weather.gov/zones/forecast/NCZ015", "https://api.weather.gov/zones/forecast/NCZ016", "https://api.weather.gov/zones/forecast/NCZ017", "https://api.weather.gov/zones/forecast/NCZ030", "https://api.weather.gov/zones/forecast/NCZ031", "https://api.weather.gov/zones/forecast/NCZ032", "https://api.weather.gov/zones/forecast/NCZ102"], "areaDesc": "Northampton; Hertford; Gates; Pasquotank; Camden; Western Currituck; Bertie; Chowan; Perquimans; Eastern Currituck", "category": "Hydro", "certainty": "Possible", "code": "IPAWSv1.0", "description": "* WHAT...Flooding caused by excessive rainfall is possible.\n\n* WHERE...A portion of northeast North Carolina, including the\nfollowing areas, Bertie, Camden, Chowan, Eastern Currituck, Gates,\nHertford, Northampton, Pasquotank, Perquimans and Western\nCurrituck.\n\n* WHEN...Through late tonight.\n\n* IMPACTS...Excessive runoff may result in flooding of rivers,\ncreeks, streams, and other low-lying and flood-prone locations.\n\n* ADDITIONAL DETAILS...\n- A quasi west-east upper trough remains nearly stationary from\nKY through VA this afternoon. This has allowed for scattered\nshowers earlier today and last night with locally heavy\nrainfall. Rainfall totals have locally already exceeded 2.5\nto 3 inches in some locations. The latest guidance shows\nshowers and embedded storms becoming more widespread this\nafternoon into tonight with localized totals of 3 to 5 inches\npossible. As such, scattered instances of flash flooding are\npossible.\n- http://www.weather.gov/safety/flood", "effective": "2026-07-12T14:31:00-04:00", "ends": "2026-07-13T06:00:00-04:00", "event": "Flood Watch", "eventCode": {"NationalWeatherService": ["FAA"], "SAME": ["FFA"]}, "expires": "2026-07-12T22:45:00-04:00", "geocode": {"SAME": ["037131", "
