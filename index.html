es\nmay fall due to very saturated soils.\n\n* ADDITIONAL DETAILS...\n- Areas of moderate to heavy rain will persist for a few more\nhours this afternoon with a continued risk of minor flooding.\nFor portions of the Outer Banks that have seen the most\nrainfall recently, especially along the Highway 12 corridor,\nflooding impacts may last beyond the ending of the heavy rain\nas floodwaters will be slow to recede.\n- http://www.weather.gov/safety/flood", "effective": "2026-07-25T14:30:00-04:00", "ends": "2026-07-25T20:00:00-04:00", "event": "Flood Watch", "eventCode": {"NationalWeatherService": ["FAA"], "SAME": ["FFA"]}, "expires": "2026-07-25T20:00:00-04:00", "geocode": {"SAME": ["037055"], "UGC": ["NCZ047", "NCZ203"]}, "headline": "Flood Watch issued July 25 at 2:30PM EDT until July 25 at 8:00PM EDT by NWS Newport/Morehead City NC", "id": "urn:oid:2.49.0.1.840.0.22875fb0c9b6bb7d09d937462eb7fdf15f432b92.002.1", "instruction": "You should monitor later forecasts and be alert for possible Flood\nWarnings. Those living in areas prone to flooding should be prepared\nto take action should flooding develop.", "language": "en-US", "messageType": "Update", "note": null, "onset": "2026-07-25T14:30:00-04:00", "parameters": {"AWIPSidentifier": ["FFAMHX"], "BLOCKCHANNEL": ["EAS", "NWEM", "CMAS"], "EAS-ORG": ["WXR"], "NWSheadline": ["FLOOD WATCH REMAINS IN EFFECT UNTIL 8 PM EDT THIS EVENING"], "VTEC": ["/O.CON.KMHX.FA.A.0001.000000T0000Z-260726T0000Z/"], "WMOidentifier": ["WGUS62 KMHX 251830"], "eventEndingTime": ["2026-07-25T20:00:00-04:00"], "expiredReferences": ["w-nws.webmaster@noaa.gov,urn:oid:2.49.0.1.840.0.ab91ac4b064d9c5fdd750a83aea5c303f64c8f7f.001.1,2026-07-24T16:34:00-04:00 w-nws.webmaster@noaa.gov,urn:oid:2.49.0.1.840.0.5a7fcf82401b443d87abc3242fd28e350749b77c.001.1,2026-07-24T13:45:00-04:00 w-nws.webmaster@noaa.gov,urn:oid:2.49.0.1.840.0.94de9289d0cf643cb37d8306da964596a736078b.001.1,2026-07-24T06:05:00-04:00 w-nws.webmaster@noaa.gov,urn:oid:2.49.0.1.840.0.029dede26
