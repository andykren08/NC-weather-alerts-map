 in flooding of rivers,\ncreeks, streams, and other low-lying and flood-prone locations.\n\n* ADDITIONAL DETAILS...\n- A quasi west-east upper trough remains nearly stationary from\nKY through VA this afternoon. This has allowed for scattered\nshowers earlier today and last night with locally heavy\nrainfall. Rainfall totals have locally already exceeded 2.5\nto 3 inches in some locations. The latest guidance shows\nshowers and embedded storms becoming more widespread this\nafternoon into tonight with localized totals of 3 to 5 inches\npossible. As such, scattered instances of flash flooding are\npossible.\n- http://www.weather.gov/safety/flood", "effective": "2026-07-12T14:31:00-04:00", "ends": "2026-07-13T06:00:00-04:00", "event": "Flood Watch", "eventCode": {"NationalWeatherService": ["FAA"], "SAME": ["FFA"]}, "expires": "2026-07-12T22:45:00-04:00", "geocode": {"SAME": ["037131", "037091", "037073", "037139", "037029", "037053", "037015", "037041", "037143"], "UGC": ["NCZ012", "NCZ013", "NCZ014", "NCZ015", "NCZ016", "NCZ017", "NCZ030", "NCZ031", "NCZ032", "NCZ102"]}, "headline": "Flood Watch issued July 12 at 2:31PM EDT until July 13 at 6:00AM EDT by NWS Wakefield VA", "id": "urn:oid:2.49.0.1.840.0.c8974a4802c912f00f532a3abeed618c1bc92708.002.1", "instruction": "You should monitor later forecasts and be alert for possible Flood\nWarnings. Those living in areas prone to flooding should be prepared\nto take action should flooding develop.", "language": "en-US", "messageType": "Alert", "note": null, "onset": "2026-07-12T14:31:00-04:00", "parameters": {"AWIPSidentifier": ["FFAAKQ"], "BLOCKCHANNEL": ["EAS", "NWEM", "CMAS"], "EAS-ORG": ["WXR"], "NWSheadline": ["FLOOD WATCH IN EFFECT THROUGH LATE TONIGHT"], "VTEC": ["/O.NEW.KAKQ.FA.A.0004.260712T1831Z-260713T1000Z/"], "WMOidentifier": ["WGUS61 KAKQ 121831"], "eventEndingTime": ["2026-07-13T06:00:00-04:00"]}, "references": [], "response": "Prepare", "scope": "Public", "sender": "w-nws.webmaster@noaa.gov", "senderName": " ", "certainty": "Possible", "code": "IPAWSv1.0", "description": "* WHAT...Flooding caused by excessive rainfall is possible.\n\n* WHERE...A portion of northeast North Carolina, including the\nfollowing areas, Bertie, Camden, Chowan, Eastern Currituck, Gates,\nHertford, Northampton, Pasquotank, Perquimans and Western\nCurrituck.\n\n* WHEN...Through late tonight.\n\n* IMPACTS...Excessive runoff may result in flooding of rivers,\ncreeks, streams, and other low-lying and flood-prone locations.\n\n* ADDITIONAL DETAILS...\n- A quasi west-east upper trough remains nearly stationary from\nKY through VA this afternoon. This has allowed for scattered\nshowers earlier today and last night with locally heavy\nrainfall. Rainfall totals have locally already exceeded 2.5\nto 3 inches in some locations. The latest guidance shows\nshowers and embedded storms becoming more widespread this\nafternoon into tonight with localized totals of 3 to 5 inches\npossible. As such, scattered instances of flash flooding are\npossible.\n- http://www.weather.gov/safety/flood", "effective": "2026-07-12T14:31:00-04:00", "ends": "2026-07-13T06:00:00-04:00", "event": "Flood Watch", "eventCode": {"NationalWeatherService": ["FAA"], "SAME": ["FFA"]}, "expires": "2026-07-12T22:45:00-04:00", "geocode": {"SAME": ["037131", "037091", "037073", "037139", "037029", "037053", "037015", "037041", "037143"], "UGC": ["NCZ012", "NCZ013", "NCZ014", "NCZ015", "NCZ016", "NCZ017", "NCZ030", "NCZ031", "NCZ032", "NCZ102"]}, "headline": "Flood Watch issued July 12 at 2:31PM EDT until July 13 at 6:00AM EDT by NWS Wakefield VA", "id": "urn:oid:2.49.0.1.840.0.c8974a4802c912f00f532a3abeed618c1bc92708.002.1", "instruction": "You should monitor later forecasts and be alert for possible Flood\nWarnings. Those living in areas prone to flooding should be prepared\nto take action should flooding develop.", "language": "en-US", "messageType": "Alert", "note": null, "onset": "2026-07-12T14:31:00-04:00", "parameters": {"AWIPSidentifier
